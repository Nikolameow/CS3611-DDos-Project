worker_processes  1;
pid /home/grinner0215/Desktop/FriendFolder/CS3611-DDoS-Project/detection/data/demo_cdn_nginx.pid;

events {
    worker_connections  1024;
}

http {
    access_log /home/grinner0215/Desktop/FriendFolder/CS3611-DDoS-Project/detection/data/demo_cdn_access.log;
    error_log /home/grinner0215/Desktop/FriendFolder/CS3611-DDoS-Project/detection/data/demo_cdn_error.log info;

    limit_req_zone $binary_remote_addr zone=per_client_req:10m rate=80r/s;
    limit_conn_zone $binary_remote_addr zone=per_client_conn:10m;

    upstream ddos_origin {
        server 10.0.0.100:8080;
        server 10.0.0.100:8081;
    }

    server {
        listen 80;
        server_name _;

        limit_req zone=per_client_req burst=80 nodelay;
        limit_conn per_client_conn 40;

        location / {
            proxy_pass http://ddos_origin;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
